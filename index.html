<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Birthdays - Ikyy & Bibil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 8s linear infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            color: white;
        }

        .header h1 {
            font-size: 3.5em;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.3em;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .countdown-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .countdown-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .countdown-card:hover {
            transform: translateY(-10px);
        }

        .countdown-card.ikyy {
            border-top: 5px solid #4facfe;
        }

        .countdown-card.bibil {
            border-top: 5px solid #f093fb;
        }

        .person-name {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }

        .ikyy .person-name {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bibil .person-name {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .birth-date {
            text-align: center;
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .timer-box {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .timer-number {
            font-size: 3em;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        .ikyy .timer-number {
            color: #4facfe;
        }

        .bibil .timer-number {
            color: #f093fb;
        }

        .timer-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message-box {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 15px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .message-en {
            font-size: 1.3em;
            font-weight: 500;
            color: #333;
            margin-bottom: 15px;
            font-style: italic;
            line-height: 1.6;
        }

        .message-id {
            font-size: 1.1em;
            color: #555;
            line-height: 1.5;
        }

        .birthday-today {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            animation: pulse 2s infinite;
        }

        .birthday-today h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 968px) {
            .countdown-wrapper {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .header h1 {
                font-size: 2.5em;
            }

            .timer {
                gap: 10px;
            }

            .timer-number {
                font-size: 2em;
            }

            .countdown-card {
                padding: 30px 20px;
            }
        }
    </style>

        // Create floating hearts
        function createHearts() {
            const container = document.getElementById('floatingHearts');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (5 + Math.random() * 3) + 's';
                heart.style.fontSize = (15 + Math.random() * 15) + 'px';
                container.appendChild(heart);

                setTimeout(() => heart.remove(), 8000);
            }, 1000);
        }

        // Countdown function
        function updateCountdown(targetDate, elementId) {
            const now = new Date().getTime();
            const target = new Date(targetDate).getTime();
            const distance = target - now;

            if (distance < 0) {
                // Birthday is today or passed, show next year
                const nextYear = new Date(targetDate);
                nextYear.setFullYear(nextYear.getFullYear() + 1);
                return updateCountdown(nextYear.toISOString().split('T')[0], elementId);
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Check if it's birthday today
            const today = new Date();
            const birthdayDate = new Date(targetDate);
            const isBirthdayToday = today.getDate() === birthdayDate.getDate() && 
                                   today.getMonth() === birthdayDate.getMonth();

            if (isBirthdayToday && days === 0 && hours === 0 && minutes === 0 && seconds === 0) {
                document.getElementById(elementId).innerHTML = `
                    <div class="birthday-today">
                        <h2>🎉 HAPPY BIRTHDAY! 🎉</h2>
                        <p>Today is your special day!</p>
                    </div>
                `;
            } else {
                document.getElementById(elementId).innerHTML = `
                    <div class="timer">
                        <div class="timer-box">
                            <span class="timer-number">${days}</span>
                            <span class="timer-label">Days</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number">${hours}</span>
                            <span class="timer-label">Hours</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number">${minutes}</span>
                            <span class="timer-label">Minutes</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number">${seconds}</span>
                            <span class="timer-label">Seconds</span>
                        </div>
                    </div>
                `;
            }
        }

        // Get next birthday date
        function getNextBirthday(month, day) {
            const now = new Date();
            const currentYear = now.getFullYear();
            let birthday = new Date(currentYear, month - 1, day);
            
            if (birthday < now) {
                birthday = new Date(currentYear + 1, month - 1, day);
            }
            
            return birthday.toISOString().split('T')[0];
        }

        // Random message function
        function updateRandomMessage(elementId) {
            const randomIndex = Math.floor(Math.random() * sweetMessages.length);
            const message = sweetMessages[randomIndex];
            
            const messageBox = document.getElementById(elementId);
            messageBox.style.opacity = '0';
            
            setTimeout(() => {
                messageBox.querySelector('.message-en').textContent = `"${message.en}"`;
                messageBox.querySelector('.message-id').textContent = message.id;
                messageBox.style.opacity = '1';
            }, 300);
        }

        // Initialize
        createHearts();

        const ikyyBirthday = getNextBirthday(5, 28); // May 28
        const bibilBirthday = getNextBirthday(3, 16); // March 16

        // Update countdowns every second
        setInterval(() => {
            updateCountdown(ikyyBirthday, 'ikyyBirthday');
            updateCountdown(bibilBirthday, 'bibilBirthday');
        }, 1000);

        updateCountdown(bibilBirthday, 'bibilBirthday');

        // Update messages every 5 seconds

        updateRandomMessage('bibilMessage');
